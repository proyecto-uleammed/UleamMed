name: CD ECS Main

on:
  workflow_run:
    workflows:
      - CI AWS ECR Main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-ecs-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROL_IAM_OIDC: ${{ secrets.AWS_ROLE_ARN }}
  REPOSITORIO_ECR: ${{ vars.AWS_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

jobs:
  desplegar_ecs:
    name: Desplegar backend en ECS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'Frontend-backend'))

    steps:
      - name: Validar configuracion requerida
        run: |
          test -n "${AWS_REGION}" || (echo "Falta variable AWS_REGION." && exit 1)
          test -n "${ROL_IAM_OIDC}" || (echo "Falta secreto AWS_ROLE_ARN." && exit 1)
          test -n "${REPOSITORIO_ECR}" || (echo "Falta variable AWS_ECR_REPOSITORY." && exit 1)
          test -n "${ECS_CLUSTER}" || (echo "Falta variable AWS_ECS_CLUSTER." && exit 1)
          test -n "${ECS_SERVICE}" || (echo "Falta variable AWS_ECS_SERVICE." && exit 1)
          test -n "${SUPABASE_DATABASE_URL}" || (echo "Falta secreto SUPABASE_DATABASE_URL." && exit 1)
          test -n "${SECRET_KEY}" || (echo "Falta secreto SECRET_KEY." && exit 1)

      - name: Configurar credenciales AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROL_IAM_OIDC }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Registrar task definition ECS para Supabase
        id: registrar_taskdef
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query 'Account' --output text)"
          IMAGEN="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORIO_ECR}:latest"

          TASKDEF_ARN_ACTUAL="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "${TASKDEF_ARN_ACTUAL}" --query 'taskDefinition' > taskdef_base.json

          COMANDO_BACKEND='alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000'

          jq \
            --arg imagen "${IMAGEN}" \
            --arg database_url "${SUPABASE_DATABASE_URL}" \
            --arg secret_key "${SECRET_KEY}" \
            --arg supabase_url "${SUPABASE_URL}" \
            --arg supabase_service_role_key "${SUPABASE_SERVICE_ROLE_KEY}" \
            --arg aws_region "${AWS_REGION}" \
            --arg comando_backend "${COMANDO_BACKEND}" \
            '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions = [
                {
                  name: "backend",
                  image: $imagen,
                  essential: true,
                  portMappings: [
                    { containerPort: 8000, protocol: "tcp" }
                  ],
                  environment: (
                    [
                      { name: "DATABASE_URL", value: $database_url },
                      { name: "SECRET_KEY", value: $secret_key },
                      { name: "CORS_ORIGINS", value: "*" },
                      { name: "ENVIRONMENT", value: "production" }
                    ]
                    + (if ($supabase_url | length) > 0 then [{ name: "SUPABASE_URL", value: $supabase_url }] else [] end)
                    + (if ($supabase_service_role_key | length) > 0 then [{ name: "SUPABASE_SERVICE_ROLE_KEY", value: $supabase_service_role_key }] else [] end)
                  ),
                  command: ["sh", "-c", $comando_backend],
                  logConfiguration: {
                    logDriver: "awslogs",
                    options: {
                      "awslogs-group": "/ecs/uleammed-backend-demo",
                      "awslogs-region": $aws_region,
                      "awslogs-stream-prefix": "backend"
                    }
                  }
                }
              ]
            ' taskdef_base.json > taskdef_supabase.json

          TASKDEF_NUEVA="$(aws ecs register-task-definition --cli-input-json file://taskdef_supabase.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "taskdef_nueva=${TASKDEF_NUEVA}" >> "$GITHUB_OUTPUT"

      - name: Desplegar nueva task definition en ECS
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.registrar_taskdef.outputs.taskdef_nueva }}" \
            --force-new-deployment

      - name: Esperar estabilidad del servicio
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Diagnostico si el despliegue falla
        if: failure()
        run: |
          echo "::group::Eventos recientes del servicio ECS"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[:15].[createdAt,message]' \
            --output table
          echo "::endgroup::"

          echo "::group::Motivo de parada de la tarea mas reciente"
          TASK_ARN="$(aws ecs list-tasks \
            --cluster "${ECS_CLUSTER}" \
            --service-name "${ECS_SERVICE}" \
            --desired-status STOPPED \
            --query 'taskArns[0]' --output text)"
          if [ -n "${TASK_ARN}" ] && [ "${TASK_ARN}" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{reason:reason,exitCode:exitCode}}'
          else
            echo "No se encontro ninguna tarea detenida todavia."
          fi
          echo "::endgroup::"

          echo "::group::Ultimas lineas de log del contenedor"
          STREAM="$(aws logs describe-log-streams \
            --log-group-name "/ecs/uleammed-backend-demo" \
            --order-by LastEventTime --descending --limit 1 \
            --query 'logStreams[0].logStreamName' --output text 2>/dev/null || true)"
          if [ -n "${STREAM}" ] && [ "${STREAM}" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "/ecs/uleammed-backend-demo" \
              --log-stream-name "${STREAM}" \
              --limit 50 \
              --query 'events[*].message' --output text
          else
            echo "No se encontro ningun log stream todavia."
          fi
          echo "::endgroup::"

      - name: Publicar resumen
        run: |
          echo "Despliegue completado en ECS." >> "$GITHUB_STEP_SUMMARY"
          echo "Cluster: ${ECS_CLUSTER}" >> "$GITHUB_STEP_SUMMARY"
          echo "Servicio: ${ECS_SERVICE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Task definition: ${{ steps.registrar_taskdef.outputs.taskdef_nueva }}" >> "$GITHUB_STEP_SUMMARY"
